<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202624" />
    <meta name="description" content="FLOWERISH transforms a Hangul name into a cursive composition and an isometric ikebana structure." />
    <title>FLOWERISH</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23202624'/%3E%3Cpath d='M5 19C10 8 17 26 27 11' fill='none' stroke='%2361CCAF' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='6' cy='19' r='2.3' fill='%23F4F7F6'/%3E%3Ccircle cx='27' cy='11' r='2.3' fill='%23F4F7F6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css?v=20260920-10" />
  </head>
  <body>
    <header class="toolbar">
      <div class="identity">
        <span class="identity-lead">FLOWERISH :</span>
        <span class="identity-subtitle">A Fabrication Study of Ikebana and Cursive</span>
      </div>

      <label class="name-field">
        <span>ENTER YOUR NAME</span>
        <input id="name-input" value="이수민" maxlength="8" autocomplete="off" spellcheck="false" />
      </label>
    </header>

    <main class="workspace" aria-live="polite">
      <section class="font-view" aria-labelledby="font-title">
        <div class="view-heading">
          <div>
            <h1 id="font-title">NAME COMPOSITION</h1>
          </div>
        </div>

        <div class="font-canvas">
          <svg id="font-svg" role="img" aria-label="흘림 폰트로 조합된 이름"></svg>
          <div id="empty-font" class="empty-state" hidden>한글 이름을 입력해 주세요.</div>
        </div>

      </section>

      <section class="object-view" aria-labelledby="object-title">
        <div class="view-heading object-heading">
          <div>
            <h2 id="object-title">FLOWER VASE ASSEMBLY</h2>
          </div>
        </div>

        <div class="object-canvas">
          <svg id="vase-svg" role="img" aria-label="이름으로 생성된 아이소메트릭 꽃병"></svg>
          <div id="empty-object" class="empty-state" hidden>이름이 꽃병의 구조가 됩니다.</div>
        </div>

        <div class="object-footer">
          <span id="unsupported" class="error-message" hidden></span>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>26-2 Basic Studio 4 · Sumin Lee</span>
      <span>© 2026 Sumin Lee. All rights reserved.</span>
    </footer>

    <script src="./app.js?v=20260920-10"></script>
  </body>
</html>
